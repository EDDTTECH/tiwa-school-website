
<!DOCTYPE html>
<html>
<head>
    <title>Mothercare Preparatory School</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #dff6ff, #fff1d6);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #0077b6;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        h2 {
            color: #0077b6;
        }

        .container {
            background-color: white;
            width: 80%;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            color: #444;
        }

        .subjects {
            background-color: #e0f7fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        footer {
            background-color: #0077b6;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mothercare Preparatory School</h1>
        <h3>Welcome to My School!</h3>
    </header>

    <div class="container">
        <h2>My Beautiful School</h2>

        <p>
            My school is beautiful and I like it.
            They teach me well and I love it.
            It is a well-mannered school.
        </p>

        <div class="subjects">
            <h2>What We Learn</h2>
            <p>
                We learn Mathematics, English, and History.
            </p>
        </div>
    </div>

    <footer>
        <p>© 2026 Mothercare Preparatory School</p>
    </footer>

</body>
</html>
